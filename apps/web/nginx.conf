server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Photo uploads from the field checklist (keep in sync with MAX_UPLOAD_MB on the API).
  client_max_body_size 30m;

  # nginx's bundled mime.types has no entry for .webmanifest, so it falls back to
  # application/octet-stream — Chrome silently refuses to treat that as a web app
  # manifest and installability breaks with no visible error.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    default_type application/javascript;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s; # PDF rendering on approval
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA routes (/jobs/…, /clients/…, /verify/<token>)
  location / {
    try_files $uri /index.html;
  }
}
