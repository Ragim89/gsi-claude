# Local development stack for GSI ERP (MVP-1).
#   docker compose up --build
# Web:    http://localhost:8080
# API:    http://localhost:3000/api/health
# MinIO:  http://localhost:9001  (console; minioadmin / minioadmin by default)
name: gsi-erp

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gsi
      POSTGRES_USER: ${POSTGRES_USER:-gsi}          # schema owner: migrations & seed only
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gsi}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gsi} -d gsi"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO's own registry: docker.io/minio/minio now refuses anonymous pulls.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API — browsers load presigned photo URLs from here
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 3000
      # The API itself connects as `gsi_app` (no BYPASSRLS) so Row-Level Security is always enforced.
      DATABASE_URL: postgres://gsi_app:${APP_DB_PASSWORD:-gsi_app}@db:5432/gsi
      DATABASE_OWNER_URL: postgres://${POSTGRES_USER:-gsi}:${POSTGRES_PASSWORD:-gsi}@db:5432/gsi
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-gsi_app}
      MIGRATE_ON_START: "true"
      SEED_ON_START: "true"
      SEED_DEMO: "true"
      SEED_PASSWORD: ${SEED_PASSWORD:-ChangeMe123!}
      SEED_REPORTS: ${SEED_REPORTS:-40}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: gsi-media
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "3000:3000"
    # Chromium needs more than the default 64 MB of shared memory for large reports.
    shm_size: "512mb"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

  # Test runner. Uses the API image (dev dependencies included) and its own database, so it
  # never touches development data:
  #   docker compose --profile test run --rm test            # unit + integration
  #   docker compose --profile test run --rm test npm run test:unit
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://gsi_app:${APP_DB_PASSWORD:-gsi_app}@db:5432/gsi_test
      DATABASE_OWNER_URL: postgres://${POSTGRES_USER:-gsi}:${POSTGRES_PASSWORD:-gsi}@db:5432/gsi_test
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-gsi_app}
      SEED_PASSWORD: ${SEED_PASSWORD:-ChangeMe123!}
      SEED_DEMO_VOLUME: "false"
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: gsi-media-test
      PUBLIC_WEB_URL: http://localhost:8080
      # Dozens of logins in a few seconds would trip the sign-in limiter and make the suite
      # flaky; the limiter itself is exercised against the development stack.
      RATE_LIMIT_DISABLED: "true"
    # vitest writes its cache into the workspace, which the `node` user cannot do.
    user: root
    working_dir: /repo/apps/api
    shm_size: "512mb"
    # Sources are mounted, so editing a test does not mean rebuilding the image. Dependencies
    # still come from the image — change package.json and the image needs a rebuild.
    volumes:
      - ./apps/api/src:/repo/apps/api/src:ro
      - ./apps/api/test:/repo/apps/api/test:ro
      - ./apps/api/migrations:/repo/apps/api/migrations:ro
      - ./apps/api/vitest.config.ts:/repo/apps/api/vitest.config.ts:ro
      - ./apps/api/vitest.integration.config.ts:/repo/apps/api/vitest.integration.config.ts:ro
      - ./apps/api/tsconfig.json:/repo/apps/api/tsconfig.json:ro
      - ./apps/api/tsconfig.test.json:/repo/apps/api/tsconfig.test.json:ro
      - ./apps/api/.eslintrc.cjs:/repo/apps/api/.eslintrc.cjs:ro
    command: ["npm", "test"]

volumes:
  db-data:
  minio-data:
