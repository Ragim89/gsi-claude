# Production stack for GSI ERP.
#
#   cp .env.production.example .env.production
#   # fill in every value — there are no development fallbacks in this file
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Differences from docker-compose.yml (the development stack), all deliberate:
#   - every secret is `${VAR:?...}` — a required variable with no default, so a missing one
#     fails `docker compose config` instead of silently starting with `gsi`/`gsi_app`/`minioadmin`;
#   - db and minio publish no ports to the host at all — reachable only from other containers
#     on this compose's network, never from outside the machine;
#   - a caddy service terminates TLS, redirects HTTP to HTTPS, and is the only thing that binds
#     80/443 on the host — see Caddyfile;
#   - MIGRATE_ON_START stays true (migrations are additive and idempotent — AI_EXECUTION_RULES
#     #5), but SEED_ON_START/SEED_DEMO are not set here: production is never seeded with demo
#     data, and its first admin user is created once by hand (docs/DEPLOYMENT.md);
#   - restart policies, resource limits and healthchecks so an orchestrator (or plain docker)
#     restarts a crashed container and never lets one runaway process starve the others.
#
# See docs/DEPLOYMENT.md for the full runbook.
name: gsi-erp-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gsi
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d gsi"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g}
    # No `ports:` — reachable only as `db:5432` from containers on this compose's network.

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.production}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.production}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }
    # No `ports:` — the S3 API is reached through Caddy (see Caddyfile) if you self-host MinIO
    # in production at all; docs/DEPLOYMENT.md also covers pointing S3_ENDPOINT at a managed
    # provider instead and dropping this service entirely. The 9001 console is never exposed.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://gsi_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env.production}@db:5432/gsi
      DATABASE_OWNER_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/gsi
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      MIGRATE_ON_START: "true"
      # Off by default (production). A staging .env may turn these on for one-time bootstrap of
      # an empty database — see .env.staging.example. seed.ts itself refuses SEED_DEMO=true
      # whenever NODE_ENV=production regardless of this flag, so production can never seed demo
      # data through this variable no matter what a stray .env sets.
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env.production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env.production}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in .env.production}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT in .env.production}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-gsi-media}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL in .env.production, e.g. https://app.example.com}
      CORS_ORIGINS: ${PUBLIC_WEB_URL:?}
      LOG_JSON: "true"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    shm_size: "512mb"
    # No `ports:` — reached only through the web container's /api/ proxy (apps/web/nginx.conf),
    # itself reached only through Caddy.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }
    # No `ports:` — reached only through Caddy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - minio
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production, e.g. app.example.com}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production, required for the certificate authority}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
    # The only service that binds a host port — TLS termination and HTTP→HTTPS redirect
    # (see ./Caddyfile). Automatic certificates need 80 and 443 reachable from the internet.

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:
